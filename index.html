<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carter</title>
    <script>
      // 在 React 挂载之前先把主题 class 打上。
      // 真实设置在 ~/.carter-app/settings.json，但那要等应用启动后才读得到 ——
      // 不先这么做，深色用户每次启动都会看到一瞬白闪。
      // 取值约定与 src/lib/theme.ts 的 THEME_KEY 一致。
      (function () {
        try {
          var pref = localStorage.getItem("carter.theme") || "dark";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
