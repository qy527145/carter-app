# 由 dist-workspace.toml 的 github-build-setup 引用：dist 把这些 step 插进
# build-local-artifacts job（actions/checkout 之后、dist build 之前），每个平台
# 的构建机都会执行一遍。
#
# 放在 .github/ 而不是 .github/workflows/，免得 GitHub 把它当成独立 workflow。
#
# ## 为什么这里要自己跑一遍 tauri build
#
# 用户要的是**安装包**（Windows 的 NSIS、macOS 的 DMG、Linux 的 deb），而不是
# dist 默认产出的 tar.xz / zip。dist 只会给目录里那个裸二进制打包，不认识 NSIS
# 和 DMG，所以安装包交给 tauri：它本来就编同一个二进制、跑同一个前端构建。
#
# dist 紧接着还会照常跑一遍自己的构建（再编一次、打压缩包、算 sha256、拼
# release notes、上传 Release）。这里做的事是：
#   1. tauri 出安装包，输出挪到 `$RUNNER_TEMP` —— dist 会清 `target/`，放里面
#      会被一起删掉；
#   2. **删掉 dist 的压缩包**（见最后一步），Release 里只留安装包。
# dist 的 Release 创建那一步认 `gh release upload` 往同一个 release 里追加，
# 所以安装包由「上传 tauri 安装包」那一步负责传。

# dist 的 [dist.dependencies.apt] 解析不了 libwebkit2gtk-4.1-dev 这个名字
# （会把 -4.1-dev 当成版本号，生成出不存在的 libwebkit2gtk-4），只能显式装。
- name: 安装 Linux 系统依赖
  if: runner.os == 'Linux'
  run: |
    sudo apt-get update
    # dist 的 [dist.dependencies.apt] 会装 appindicator / rsvg / patchelf 等，
    # 但它在 build-setup **之后**才跑；tauri bundle 现在就把它用到的补齐。
    sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

- name: 安装 Bun
  uses: oven-sh/setup-bun@v2
  with:
    bun-version: 1.4.2

- name: 安装前端依赖
  run: bun install --frozen-lockfile

- name: 构建前端
  # tauri::generate_context! 在编译期就把 ../dist 嵌进二进制，这里必须先产出。
  run: bun run web:build

- name: 用 tauri 出安装包
  shell: bash
  env:
    MATRIX_TARGETS: ${{ toJson(matrix.targets) }}
  run: |
    # 每台构建机只出 native 产物，且只要安装包本身：
    #   Windows → NSIS `.exe`（不写 msi：WiX 只在这台机器上才编得出来，而用户只要 NSIS）
    #   macOS   → `.dmg`（x86_64 那份矩阵里没有，见 dist-workspace.toml）
    #   Linux   → `.deb`（AppImage / rpm 不要）
    case "$RUNNER_OS" in
      macOS)   BUNDLES="dmg" ;;
      Windows) BUNDLES="nsis" ;;
      *)       BUNDLES="deb" ;;
    esac
    TARGET="$(node -e 'console.log(JSON.parse(process.env.MATRIX_TARGETS || "[]")[0] || "")')"
    if [ -n "$TARGET" ]; then
      bun x tauri build --target "$TARGET" --bundles "$BUNDLES"
      OUT="target/$TARGET/release/bundle"
    else
      bun x tauri build --bundles "$BUNDLES"
      OUT="target/release/bundle"
    fi
    # dist 后面会用 `tauri build` 同样的 target 再编一次，产物目录会整个重写。
    # 先把安装包挪出 `target/`。
    STAGE="$RUNNER_TEMP/installers"
    mkdir -p "$STAGE"
    case "$RUNNER_OS" in
      macOS)   cp "$OUT"/dmg/*.dmg "$STAGE"/ ;;
      Windows) cp "$OUT"/nsis/*.exe "$STAGE"/ ;;
      *)       cp "$OUT"/deb/*.deb "$STAGE"/ ;;
    esac
    # 产物文件名带空格（`Carter_0.1.0_aarch64.dmg`），上传那一步用
    # `strip_components` 式的逐文件处理，不靠 shell 展开。
    echo "INSTALLER_DIR=$STAGE" >> "$GITHUB_ENV"

- name: 上传 tauri 安装包
  uses: actions/upload-artifact@v7
  with:
    # 三台构建机各一份：安装包文件名里本来就带平台与架构，合并后不会撞名。
    # 名字与 dist 的 `artifacts-*` **有意错开**：后者会被 dist 当成自己的产物
    # 一起传进 Release（正是要去掉的压缩包），这一份交给收尾那一步单独传。
    name: installers-${{ matrix.targets && matrix.targets[0] || 'native' }}
    path: ${{ env.INSTALLER_DIR }}/*
    if-no-files-found: error

# dist 自己的压缩包在这里删不掉：本文件的 step 全排在 `dist build` **之前**。
# 删除与安装包的上传都放在 `post-announce-jobs`（见 .github/post-announce.yml），
# 那一步在 dist 生成全局清单之后、发 Release 之前执行。
