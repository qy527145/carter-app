name: probe-token
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: draft vs published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== A) 建 published release（github-actions 自动建 tag）"
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="probe-pub-$GITHUB_RUN_ID" -f name=probe -f body=probe \
            && echo "PUBLISHED_OK" || echo "PUBLISHED_FAIL"
          echo "== B) 建 draft release"
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="probe-draft-$GITHUB_RUN_ID" -f name=probe -f body=probe -F draft=true \
            && echo "DRAFT_OK" || echo "DRAFT_FAIL"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/tags/probe-pub-$GITHUB_RUN_ID" || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/tags/probe-draft-$GITHUB_RUN_ID" || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/probe-pub-$GITHUB_RUN_ID" || true
          exit 0
