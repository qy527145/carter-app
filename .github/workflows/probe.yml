name: probe-token
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: 建 → 删 release（留 tag）→ 再建
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          T="probe-del-$GITHUB_RUN_ID"
          echo hi > a.txt
          echo "== 1) 首次建 release"
          gh release create "$T" --target "$GITHUB_SHA" --title "$T" --notes-file a.txt a.txt && echo "FIRST_OK" || echo "FIRST_FAIL"
          echo "== 2) 删 release，保留 tag"
          gh release delete "$T" --yes && echo "DEL_OK" || echo "DEL_FAIL"
          echo "== 3) 同一个 tag 再建一次"
          gh release create "$T" --target "$GITHUB_SHA" --title "$T" --notes-file a.txt a.txt && echo "SECOND_OK" || echo "SECOND_FAIL"
          echo "== 4) 清理"
          gh release delete "$T" --yes --cleanup-tag || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$T" || true
          exit 0
