name: probe-token
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 原样复刻 release.yml 的建 release 命令
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          T="probe-gh-$GITHUB_RUN_ID"
          git tag "$T"
          git push origin "refs/tags/$T" || echo "push tag failed"
          echo "== A) gh release create 带 --target + 一个附件"
          echo hi > a.txt
          gh release create "$T" --target "$GITHUB_SHA" --title "$T" --notes-file a.txt a.txt \
            && echo "CREATE_OK" || echo "CREATE_FAIL"
          echo "== B) 干净环境再试一次（不带 --target）"
          T2="probe2-$GITHUB_RUN_ID"; git tag "$T2"; git push origin "refs/tags/$T2"
          gh release create "$T2" --title "$T2" --notes-file a.txt \
            && echo "CREATE2_OK" || echo "CREATE2_FAIL"
          gh release delete "$T" --yes --cleanup-tag || true
          gh release delete "$T2" --yes --cleanup-tag || true
          exit 0
