name: Updater release

# 自更新包的收尾：把各平台构建机传上来的 tauri 安装包（`updater-artifacts-*`）
# 收齐，生成 `latest.json`，传进当前 tag 的 GitHub Release。
#
# 这个文件**不会**被 dist 生成或校验，所以可以随便写。它是通过
# `dist-workspace.toml` 的 `post-announce-jobs` 被 dist 的 release.yml 调起的：
# dist 会把一个 `needs: [plan, announce]` 的 `custom-updater-release` job 追加进
# release.yml，也就是「Release 已经建好、dist 的产物已经传完」之后才跑。
#
# 为什么不直接改 release.yml：dist 会校验那个文件必须与它生成的内容完全一致，
# 任何手改都会让 CI 在 plan 阶段失败（v0.1.0 的 Release 连着几次就是这么挂的）。
#
# **不要**在这里声明 `permissions:`：reusable workflow 的权限是「调用方 ∩ 自己」，
# 而调用方（dist 生成的 job）只有仓库默认的 `contents: write`。声明 `actions: read`
# 反而会让整条 workflow 在启动时被判无效（startup_failure）。下载同一次运行里
# 上传的 artifacts 用运行自带的 token 就能读，不需要额外权限。

on:
  workflow_call:
    inputs:
      plan:
        description: dist 的 plan（JSON 字符串）
        required: true
        type: string

jobs:
  latest-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: 收齐各平台的安装包
        uses: actions/download-artifact@v8
        with:
          pattern: updater-artifacts-*
          path: updater
          merge-multiple: true

      - name: 生成 latest.json
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          TAG="$(node -e 'console.log(JSON.parse(process.env.PLAN).announcement_tag)')"
          bun run scripts/latest-json.ts "${TAG#v}" "$TAG" updater

      - name: 传进 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN: ${{ inputs.plan }}
        run: |
          TAG="$(node -e 'console.log(JSON.parse(process.env.PLAN).announcement_tag)')"
          # `--clobber`：重跑同一次发布时覆盖旧的，而不是报错。
          # 各平台的安装包（.app.tar.gz / -setup.exe.zip / .AppImage.tar.gz 及 .sig）
          # 是 latest.json 指向的东西，一起传上去。
          mapfile -t FILES < <(find updater -type f \
            \( -name "*.tar.gz" -o -name "*.tar.gz.sig" \
               -o -name "*-setup.exe.zip" -o -name "*-setup.exe.zip.sig" \))
          echo "上传：latest.json + ${#FILES[@]} 个安装包"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            updater/latest.json "${FILES[@]}"
