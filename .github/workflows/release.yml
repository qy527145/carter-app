name: Release

# 发版：三台构建机各跑一次 `tauri build`，Release 里只放三个安装包。
#
#   Windows                → NSIS `.exe`
#   macOS (Apple Silicon)  → `.dmg`
#   Linux (x86_64)         → `.deb`
#
# 为什么不用 cargo-dist：它只给「裸二进制」打包（tar.xz / zip + sha256），要发
# 安装包就得在它之外再跑一次 tauri build，然后再把它的归档包从 Release 里删掉
# —— 两套编排叠在一起，出问题的地方比解决的问题还多（v0.1.1 第一次发版就卡在
# 这条链路上）。这里只有一条路：编出安装包，传上去。
#
# 触发：
#   - 推 `v*` tag（`bun run upgrade patch` 之后 `git push --tags`）
#   - 手动：Actions → Release → Run workflow，tag 填 v0.1.2；填 dry-run 只构建。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.1.2）；填 dry-run 只构建不发版"
        required: true
        default: dry-run
        type: string

permissions:
  contents: write

concurrency:
  # 同一个 tag 的多次发布串行化：两个 run 同时建 Release 会互相踩。
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")

          # 手动触发用表单里的 tag；推 tag 触发用 ref_name。
          input='${{ github.event.inputs.tag }}'
          if [ "$input" = "dry-run" ]; then
            # 只构建不发版：tag 无意义，按当前版本号凑一个（不校验也不使用）。
            tag="v$conf"
            publish=false
          elif [ -n "$input" ]; then
            tag="$input"
            publish=true
          else
            tag="$GITHUB_REF_NAME"
            publish=true
          fi

          # 发版时 tag 的版本号必须与两处版本号一致，否则文件名与包内版本对不上。
          version="${tag#v}"
          echo "tag=$tag version=$version tauri.conf=$conf package.json=$pkg publish=$publish"
          if [ "$publish" = "true" ] && { [ "$version" != "$conf" ] || [ "$version" != "$pkg" ]; }; then
            echo "::error::tag $tag 与 src-tauri/tauri.conf.json ($conf) / package.json ($pkg) 版本号不一致，先跑 bun run upgrade"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bundles: nsis
            ext: exe
          - os: macos-15 # Apple Silicon；Intel Mac 不发
            bundles: dmg
            ext: dmg
          - os: ubuntu-22.04
            bundles: deb
            ext: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf build-essential libxdo-dev
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 缓存 Rust 产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: 安装前端依赖
        run: bun install --frozen-lockfile
      - name: 打安装包
        # 前端由 tauri.conf.json 的 beforeBuildCommand 自己构建，不用另跑
        # `bun run web:build`。
        run: bun x tauri build --bundles ${{ matrix.bundles }}
      - name: 收集安装包
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/installers"
          mkdir -p "$stage"
          find target/release/bundle -type f -name '*.${{ matrix.ext }}' -exec cp {} "$stage"/ \;
          ls -l "$stage"
          # 一个都没有说明打包静默失败了，别让后面建出一个空 Release。
          test -n "$(ls -A "$stage")"
      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: ${{ runner.temp }}/installers/*
          if-no-files-found: error

  release:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 取回安装包
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: dist-installers
          merge-multiple: true
      - name: 三种安装包缺一不可
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist-installers
          for ext in exe dmg deb; do
            if ! ls dist-installers/*."$ext" >/dev/null 2>&1; then
              echo "::error::缺少 .$ext 安装包"
              exit 1
            fi
          done
      - name: 建 Release 并上传安装包
        env:
          # 优先用 PAT：仓库若把默认 GITHUB_TOKEN 限制成只读，workflow token 建
          # Release 会被拒（403 Resource not accessible by integration）。配一个
          # 带 repo 权限的 secrets.RELEASE_TOKEN 就能绕开；没配就退回 GITHUB_TOKEN。
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          exe=$(cd dist-installers && ls *.exe)
          dmg=$(cd dist-installers && ls *.dmg)
          deb=$(cd dist-installers && ls *.deb)

          # 幂等：重跑同一个 tag 时写回笔记并覆盖附件，而不是失败。
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<EOF
          Carter $VERSION

          | 平台 | 文件 |
          | ---- | ---- |
          | Windows | \`$exe\` |
          | macOS (Apple Silicon) | \`$dmg\` |
          | Linux (x86_64) | \`$deb\` |
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖附件"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Carter $VERSION" --notes-file "$notes"
          else
            # 不带 --target：tag 已经由推 tag / bun run upgrade 建好，直接挂上去。
            # 硬写 --target "$GITHUB_SHA" 会把 Release 指到 main 的提交上，
            # 与 tag 指向的提交不是同一个（手动触发时尤其明显）。
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Carter $VERSION" --notes-file "$notes"
          fi

          gh release upload "$TAG" dist-installers/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Release 里的附件："
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
