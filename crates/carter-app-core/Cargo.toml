[package]
name = "carter-app-core"
version.workspace = true
edition.workspace = true
description = "carter-app 的应用核心：会话编排、事件桥、状态根。刻意不依赖 Tauri。"

[dependencies]
carter = { workspace = true }
llm_adapt_core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
arc-swap = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
# 界面里改 config.toml 用的**保真** TOML 编辑器：保留注释、格式与 `${ENV}` 字面量。
# 不能用 serde 反序列化再序列化回去 —— 那条路会把环境变量引用烤成明文密钥，
# 详见 src/config_edit.rs 顶部的说明。
toml_edit = { workspace = true }
# 自己实现 `carter::tools::Tool` 需要它（trait 用了 #[async_trait]）。
async-trait = "0.1"
# 粘贴进来的图片走 JSON 传字节；顺带把图读回成 data URL 给界面显示。
base64 = "0.22"

# Windows 上用 MultiByteToWideChar 按 OEM 代码页解 cmd 的输出。
# 中文环境下 `dir`/`ipconfig` 吐的是 GBK，直接 utf8_lossy 会得到一片 �。
# windows-sys 本来就在依赖树里（经 tauri），这里只是显式声明 + 开 feature。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }
