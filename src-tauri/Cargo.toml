[package]
name = "carter-app"
version.workspace = true
edition.workspace = true
description = "carter-app —— Tauri 桌面 agent 客户端"
# dist 据此决定 GitHub Release 发到哪个仓库。
repository = "https://github.com/qy527145/carter-app"

[lib]
# `_lib` 后缀看似多余，但它是必要的：不加的话 lib 名与 bin 名冲突（Windows 上必现）。
# 见 https://github.com/rust-lang/cargo/issues/8519
name = "carter_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
carter-app-core = { path = "../crates/carter-app-core" }
carter = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# debug 构建里读仓库根的 `.env`（`CARTER_LOG` 等本地开发开关）。发布包不读它。
dotenvy = "0.15"

# 只在桌面端有意义的插件，移动端编译时自动跳过。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 重复启动时唤起已有窗口：助理常驻托盘，两个进程同时盯观察源会重复接单。
tauri-plugin-single-instance = "2"
# 记住窗口位置、尺寸与最大化状态。
tauri-plugin-window-state = "2"
# 自更新：验签 / 装包 / 在 Windows 上拉起安装器。只作库用（`UpdaterBuilder`），
# 不注册前端命令 —— 检查和下载由 `updater.rs` 自己做（要先在我们自己的加速源里选）。
tauri-plugin-updater = "2.14"
# 更新包先下到应用私有目录再验签，需要原子落盘。
tempfile = "3"
