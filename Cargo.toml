[workspace]
resolver = "2"
members = ["crates/carter-app-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# 底层 harness：agent 循环、工具、会话、技能、MCP。
carter = "0.1.4"
# 线协议底座：三协议编解码、SSE、内容块装配。经由 carter 传递进来，但视图层
# 要直接用 IR 类型，所以显式依赖一次。版本必须与 carter 依赖的那个一致 ——
# 两个新类型共存会在类型检查上炸（同一个 crate 的两个版本是两套类型）。
llm_adapt_core = "0.1.1"

# `process` 是 bash 工具起子进程要用的；`io-util` 是前台命令的管道读取任务
# （`AsyncReadExt`）要用的 —— 不能指望别的 crate 顺带开这两个 feature。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# 读多写少的配置用 ArcSwap：热重载时读方永远拿得到一致快照、不阻塞。
arc-swap = "1"
dashmap = "6"
futures = "0.3"
# 界面里改 `~/.carter/config.toml` 用。刻意不复用 carter 内部的 toml 版本 ——
# 那样会被绑死在别人的依赖升级节奏上，而这里只是多编一个小 crate。
# `serde` 特性是给 `toml_edit::de` 用的（读回原始值填表单）。
toml_edit = { version = "0.22", features = ["serde"] }
# 文件系统监听：回答末尾「这一轮实际改了哪些文件」靠它，而不是去解析 shell 命令。
notify = "8"
# 用户在设置里写的额外忽略规则（glob）。只匹配路径字符串，不遍历目录。
globset = "0.4"
# 内置 ripgrep 引擎：grep 工具直接用 ripgrep 的库，不要求系统装 `rg`。
# `ignore` 负责遍历目录并遵守 .gitignore（与 rg 默认行为一致），
# `grep-searcher` / `grep-regex` 是 ripgrep 内核的搜索驱动与正则匹配器。
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
# 渠道编辑器里的「从上游拉取模型」要直接请求 `GET {base}/v1/models`。
# 版本与 feature 跟 carter 自己那条保持一致（它已经把它带进依赖树了），
# 免得同一个 crate 编两遍。`system-proxy` 让跑在代理后面的机器也能拉。
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy"] }
# 定时任务要按**本机时间**算「每天 9:00」，还要处理夏令时的跳表/回拨。
# 手算 UTC 偏移这件事看着简单，实际是给自己埋「某天早上没跑」的坑。
# 只开 `clock`（拿系统时区）与 `std`：serde 特性用不上，任务里的时间一律存
# epoch 毫秒，而不是让 chrono 的类型进文件格式。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# 见 https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
